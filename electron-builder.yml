appId: 'LBDS Launcher'
productName: 'LBDS Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2021-2026 Le Banquet du Sorcier'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  signtoolOptions:
    publisherName: "Le Banquet du Sorcier"
    certificateSubjectName: "Le Banquet du Sorcier"
  sign:
    trustedSigning:
      endpoint: "https://weu.codesigning.azure.net/"
      certificateProfileName: "lbds-launcher"
      codeSigningAccountName: "le-banquet-du-sorcier"

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  extendInfo:
    NSMicrophoneUsageDescription: "Pour pouvoir utiliser le vocal de proximité, autorisez l'usage du micro."

# Linux Configuration
linux: 
  target: 'deb'
  maintainer: 'Le Banquet du Sorcier'
  vendor: 'Le Banquet du Sorcier'
  synopsis: 'Le Banquet du Sorcier'
  description: ''
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'